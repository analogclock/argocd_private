version: "3.9"
# Manually create default network to avoid issues with FortiClient VPN.
# From: https://stackoverflow.com/a/50948930/706456
networks:
  default:
    ipam:
      config:
        - subnet: 172.16.239.0/24
          gateway: 172.16.239.1
services:
  build_env:
    volumes:
      - ./:/saas_repo
      - ~/.aws/:/root/.aws/
      - /var/run/docker.sock:/var/run/docker.sock # required for docker
    build:
      context: ./
      dockerfile: build/Dockerfile
      args:
        DOCKER_REGISTRY: ${DOCKER_REGISTRY_NEXUS_URL}
        DOCKER_UBUNTU_VERSION: ${DOCKER_UBUNTU_VERSION}
        NEXUS_PYPI_URL: ${NEXUS_PYPI_URL} # Python PYPI url
        NEXUS_APT_PROXY: ${NEXUS_APT_PROXY:-http://archive.ubuntu.com/ubuntu/}
        NEXUS_APT_SECURITY_PROXY: ${NEXUS_APT_SECURITY_PROXY:-http://security.ubuntu.com/ubuntu/}
        NEXUS_DOCKER_APT_PROXY: ${NEXUS_DOCKER_APT_PROXY:-https://download.docker.com/linux/ubuntu}
        NEXUS_AWS_PROXY: ${NEXUS_AWS_PROXY:-https://awscli.amazonaws.com}
        NEXUS_HASHICORP_PROXY: ${NEXUS_HASHICORP_PROXY:-https://releases.hashicorp.com}
        NEXUS_GITHUB_PROXY: ${NEXUS_GITHUB_PROXY:-https://github.com}
        BUILD_HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
    image: ${DOCKER_REGISTRY_NEXUS_URL}fsiem-saas-build
    container_name: fsiem-saas-build
    environment:
      # Version and build type
      - VERSION_MAJOR=${VERSION_MAJOR}
      - VERSION_MINOR=${VERSION_MINOR}
      - VERSION_PATCH=${VERSION_PATCH}
      - VERSION_REVISION=${VERSION_REVISION}
      - DEVOPS_BUILD_NUMBER=${DEVOPS_BUILD_NUMBER}
      - DEVOPS_BUILD_TYPE=${DEVOPS_BUILD_TYPE}
      # Versions of the docker base images
      - DOCKER_UBUNTU_VERSION=${DOCKER_UBUNTU_VERSION}
      - DOCKER_DOTNET_VERSION=${DOCKER_DOTNET_VERSION}
      - DOCKER_NODE_VERSION=${DOCKER_NODE_VERSION}
      - DOCKER_PYTHON_VERSION=${DOCKER_PYTHON_VERSION}
      # Merge request runner vars
      - CI_ENVIRONMENT_NAME=${CI_ENVIRONMENT_NAME}
      - CI_COMMIT_SHORT_SHA=${CI_COMMIT_SHORT_SHA}
      - CI_MERGE_REQUEST_ID=${CI_MERGE_REQUEST_ID}
      # AWS
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      # Deployment
      - TF_PORTAL_DEPLOY_DIR=${TF_PORTAL_DEPLOY_DIR}
      - TF_ENV_SETUP_DEPLOY_DIR=${TF_ENV_SETUP_DEPLOY_DIR}
      - TF_BM_DEPLOY_DIR=${TF_BM_DEPLOY_DIR}
      - TF_BM_COLLS_DEPLOY_DIR=${TF_BM_COLLS_DEPLOY_DIR}
      # Benchmarking
      - COLLECTOR_INSTANCE_COUNT=${COLLECTOR_INSTANCE_COUNT}
      - BM_SERIAL_NUMBER=${BM_SERIAL_NUMBER}
      # Docker registry
      - DOCKER_REGISTRY_NEXUS_URL=${DOCKER_REGISTRY_NEXUS_URL}
      # NUGET proxy
      - NEXUS_NUGET_PROXY=${NEXUS_NUGET_PROXY}
      # NPM proxy
      - NEXUS_NPM_PROXY=${NEXUS_NPM_PROXY}
      # PYPI url
      - NEXUS_PYPI_URL=${NEXUS_PYPI_URL}
      # APT proxy
      - NEXUS_APT_PROXY=${NEXUS_APT_PROXY:-http://archive.ubuntu.com/ubuntu/}
      # APT SECURITY proxy
      - NEXUS_APT_SECURITY_PROXY=${NEXUS_APT_SECURITY_PROXY:-http://security.ubuntu.com/ubuntu/}
      # APK main proxy
      - NEXUS_APK_PROXY=${NEXUS_APK_PROXY:-https://dl-cdn.alpinelinux.org/alpine/v3.19/main}
      # APK community proxy
      - NEXUS_APK_COMMUNITY_PROXY=${NEXUS_APK_COMMUNITY_PROXY:-https://dl-cdn.alpinelinux.org/alpine/v3.19/community}

      # Terraform provider installation
      # empty denotes using the normal registry
      - NEXUS_TERRAFORM_PROXY=${NEXUS_TERRAFORM_PROXY}

      # AWS address to contact for aws cli
      - NEXUS_AWS_PROXY=${NEXUS_AWS_PROXY:-https://awscli.amazonaws.com}

      # HASHICORP address to contact for terraform
      - NEXUS_HASHICORP_PROXY=${NEXUS_HASHICORP_PROXY:-https://releases.hashicorp.com}

      # Github address to contact for downloads from Github
      - NEXUS_GITHUB_PROXY=${NEXUS_GITHUB_PROXY:-https://github.com}
      # Generic HTTP proxy for all other components that don't have supported package managers
      - HTTPS_PROXY=${BUILD_HTTP_PROXY:-}

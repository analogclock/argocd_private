<div *ngIf="isAuthenticated && (userService.accountSelected$ | async) as account; else dummy_menu">
    <div>
        <img class="logo" alt="forti-cloud-logo"
            [src]="sanitizer.bypassSecurityTrustUrl('data:image/svg+xml;base64,' + account.logo)">
        <div class="menu-container services" #services (click)="forceServices()">
            <i class="service"></i> Services<i class="arrow-down"></i>
            <div [hidden]="open !== services" class="dropdown">
                <div class="left">
                    <div *ngIf="account.serviceMenu[0] as menuHeader">
                        <div class="menu-header">{{ menuHeader.displayName }}</div>
                        <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body bi-column">
                            <button *ngFor="let portalMenuItem of menuHeader.items"
                                (click)="selectPortal(portalMenuItem, $event)" class="service-menu-button"
                                [class.disabled-menu-button]="portalMenuItem.visibility === 'ShowDisabled'">
                                <img class="image-container"
                                    [src]="sanitizer.bypassSecurityTrustUrl('data:image/svg+xml;base64,' + portalMenuItem.imageContent)">
                                <span>{{ portalMenuItem.displayName }}</span>
                            </button>
                            <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                        </form>
                    </div>
                    <div *ngIf="account.serviceMenu[1] as menuHeader">
                        <div class="menu-header">{{ menuHeader.displayName }}</div>
                        <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body bi-column">
                            <button *ngFor="let portalMenuItem of menuHeader.items"
                                (click)="selectPortal(portalMenuItem, $event)" class="service-menu-button"
                                [class.disabled-menu-button]="portalMenuItem.visibility === 'ShowDisabled'">
                                <img class="image-container"
                                    [src]="sanitizer.bypassSecurityTrustUrl('data:image/svg+xml;base64,' + portalMenuItem.imageContent)">
                                <span>{{ portalMenuItem.displayName }}</span>
                            </button>
                            <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                        </form>
                    </div>
                </div>
                <div class="right">
                    <div *ngIf="account.serviceMenu[2] as menuHeader">
                        <div class="menu-header">{{ menuHeader.displayName }}</div>
                        <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body bi-column">
                            <button *ngFor="let portalMenuItem of menuHeader.items"
                                (click)="selectPortal(portalMenuItem, $event)" class="service-menu-button"
                                [class.disabled-menu-button]="portalMenuItem.visibility === 'ShowDisabled'">
                                <img class="image-container"
                                    [src]="sanitizer.bypassSecurityTrustUrl('data:image/svg+xml;base64,' + portalMenuItem.imageContent)">
                                <span>{{ portalMenuItem.displayName }}</span>
                            </button>
                            <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="menu-container support" #support (click)="forceSupport()">
            Support<i class="arrow-down"></i>
            <div [hidden]="open !== support" class="dropdown">
                <div class="left">
                    <div *ngIf="account.supportMenu[0] as menuHeader">
                        <div class="menu-header">
                            <form method="POST" (ngSubmit)="onSubmit($event)">
                                <button (click)="selectedPortal = menuHeader" class="support-menu-header-button">
                                    <span>{{  menuHeader.displayName }}</span>
                                </button>
                                <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                            </form>
                        </div>
                        <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body mono-column">
                            <button *ngFor="let portalMenuItem of menuHeader.items"
                                (click)="selectedPortal = portalMenuItem" class="support-menu-button"
                                [class.disabled-menu-button]="portalMenuItem.visibility === 'ShowDisabled'">
                                <span>{{ portalMenuItem.displayName }}</span>
                            </button>
                            <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                        </form>
                    </div>
                </div>
                <div class="right">
                    <div *ngIf="account.supportMenu[1] as menuHeader">
                        <div class="menu-header">
                            <form method="POST" (ngSubmit)="onSubmit($event)">
                                <button (click)="selectedPortal = menuHeader" class="support-menu-header-button">
                                    <span>{{  menuHeader.displayName }}</span>
                                </button>
                                <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                            </form>
                        </div>
                        <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body bi-column">
                            <button *ngFor="let portalMenuItem of menuHeader.items"
                                (click)="selectedPortal = portalMenuItem" class="support-menu-button"
                                [class.disabled-menu-button]="portalMenuItem.visibility === 'ShowDisabled'">
                                <span>{{ portalMenuItem.displayName }}</span>
                            </button>
                            <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                        </form>
                    </div>
                </div>
                <div class="right">
                    <div *ngIf="account.supportMenu[2] as menuHeader">
                        <div class="menu-header">
                            <form method="POST" (ngSubmit)="onSubmit($event)">
                                <button (click)="selectedPortal = menuHeader" class="support-menu-header-button">
                                    <span>{{  menuHeader.displayName }}</span>
                                </button>
                                <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                            </form>
                        </div>
                        <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body bi-column">
                            <button *ngFor="let portalMenuItem of menuHeader.items"
                                (click)="selectedPortal = portalMenuItem" class="support-menu-button"
                                [class.disabled-menu-button]="portalMenuItem.visibility === 'ShowDisabled'">
                                <span>{{ portalMenuItem.displayName }}</span>
                            </button>
                            <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                        </form>
                    </div>
                    <div *ngIf="account.supportMenu[3] as menuHeader">
                        <div class="menu-header">
                            <form method="POST" (ngSubmit)="onSubmit($event)">
                                <button (click)="selectedPortal = menuHeader" class="support-menu-header-button">
                                    <span>{{  menuHeader.displayName }}</span>
                                </button>
                                <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                            </form>
                        </div>
                        <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body bi-column">
                            <button *ngFor="let portalMenuItem of menuHeader.items"
                                (click)="selectedPortal = portalMenuItem" class="support-menu-button"
                                [class.disabled-menu-button]="portalMenuItem.visibility === 'ShowDisabled'">
                                <span>{{ portalMenuItem.displayName }}</span>
                            </button>
                            <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="menu-container user" #user (click)="forceUserDropdown()">
        {{ account.details.displayEmail }} <i class="arrow-down"></i>
        <div [hidden]="open !== user" class="dropdown">
            <div class="account-info">
                <div id="user-information">
                    <div class="user-info-item">
                        <span class="field">Account</span>
                        <span class="value">{{ account.details.accountId }}/{{ account.details.accountCompany }}</span>
                    </div>
                    <div class="user-info-item">
                        <span class="field">Username</span>
                        <span class="value">{{ account.details.displayEmail }}</span>
                    </div>
                </div>
                <div class="user-menu">
                    <form method="POST" (ngSubmit)="onSubmit($event)" class="menu-body mono-column">
                        <div>
                            <button *ngFor="let userMenuItem of account.userMenu"
                                (click)="selectedPortal = userMenuItem" class="user-menu-button"
                                [class.disabled-menu-button]="userMenuItem.visibility === 'ShowDisabled'">
                                <img class="image-container"
                                    [src]="sanitizer.bypassSecurityTrustUrl('data:image/svg+xml;base64,' + userMenuItem.imageContent)">
                                <span>{{ userMenuItem.displayName }}</span>
                            </button>
                        </div>
                        <input type="hidden" name="h_key" [value]="fortifiedHKeyData">
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

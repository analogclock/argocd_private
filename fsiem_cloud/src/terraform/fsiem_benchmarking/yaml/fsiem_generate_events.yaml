description: |-
  Generate events on the collectors
schemaVersion: "0.3"
assumeRole: "${assume_role}"
parameters:
  SerialNumber:
    type: String
    description: serial number of the collector
  Eps:
    type: String
    description: specify half of the eps that needs to be generated by a collector
    default: "80"
mainSteps:
  - name: generate_events
    action: 'aws:runCommand'
    inputs:
      DocumentName: AWS-RunShellScript
      Parameters:
        commands: |-
          echo "Start generating events on {{SerialNumber}} collector"
          sudo -s /root/ec2test/startDemo "{{Eps}}"
          echo "Started generating events"
      CloudWatchOutputConfig :
          CloudWatchLogGroupName: '/aws/lambda/lambda_ssm_collectors_auto_${environment}'
          CloudWatchOutputEnabled: true
      Targets:
        - Key: 'tag:Environment'
          Values:
            - '${environment}'
        - Key: 'tag:SerialNumber'
          Values:
            - '{{SerialNumber}}'
        - Key: 'tag:Role'
          Values:
            - 'collector'
      MaxConcurrency: '1'




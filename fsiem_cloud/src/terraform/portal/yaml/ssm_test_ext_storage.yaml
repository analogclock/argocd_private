description: |-
  Test to verify that data can be copied to external storage from worker
schemaVersion: '0.3'
assumeRole: "${assume_role}"
parameters:
  SerialNumber:
    type: String
    description: Serial number of the fsiem cloud stack
    default: 'FSMCLD<id>'
  ExternalStorage:
    type: String
    description: External storage s3 bucket name
    default: '<s3-bucket-name-for-ext-storage>'
mainSteps:
  - name: create_iam_policy_ext_storage
    action: 'aws:executeScript'
    onFailure: Abort
    isCritical: true
    description: Create iam policy
    inputs:
      Runtime: python3.8
      Handler: create_iam_inline_policies_handler
      InputPayload:
        ExternalStorage: '{{ExternalStorage}}'
      Script: |
        import boto3
        import json

        def create_iam_inline_policies_handler(event, context):
          client = boto3.client('iam')
          exs = event['ExternalStorage']
          policy_json = {
              "Version": "2012-10-17",
              "Statement": [
                  {
                      "Effect": "Allow",
                      "Action": [
                          "s3:PutObject",
                          "s3:ListBucket"
                      ],
                      "Resource": [
                          "arn:aws:s3:::" + exs + "/*",
                          "arn:aws:s3:::" + exs
                      ]
                  }
              ]
          }
          response = client.create_policy(
              PolicyName=f"test_ext_storage_policy_ssm_${environment}",
              PolicyDocument=json.dumps(policy_json)
          )
          print(response)
  - name: attach_iam_policy_role_ext_storage
    action: 'aws:executeScript'
    onFailure: 'step:detach_iam_policy_role_ext_storage'
    isCritical: true
    description: Attach iam policy to the worker instance
    inputs:
      Runtime: python3.8
      Handler: attach_iam_policy_to_role_handler
      InputPayload:
        SerialNumber: '{{SerialNumber}}'
      Script: |
        import boto3
        import json

        def attach_iam_policy_to_role_handler(event, context):
            sn = event['SerialNumber']
            resource = boto3.resource('iam')
            role_name = sn + '-fsiem-cloud-${environment}'
            role = resource.Role(role_name)
            response = role.attach_policy(
                PolicyArn='arn:aws:iam::${account_id}:policy/test_ext_storage_policy_ssm_${environment}'
            )
            print(response)
  - name: wait_iam_task
    description: Wait until the iam policy is created and attached to the instance
    action: "aws:sleep"
    inputs:
      Duration: PT1M
  - name: test_ext_storage_functionality
    description: Test to check if the copy to external storage works fine
    action: 'aws:runCommand'
    isCritical: true
    onFailure: 'step:detach_iam_policy_role_ext_storage'
    inputs:
      DocumentName: AWS-RunShellScript
      Parameters:
        commands: |-
          echo "Copy clickhouse data to external storage s3 bucket"
          ec2ins_id=$(wget -q -O - http://169.254.169.254/latest/meta-data/instance-id)
          echo "Worker instance id: $ec2ins_id"
          query="SELECT phRecvTime, phCustId, customer, eventType , rawEventMsg FROM fsiem.events_replicated LIMIT 10 FORMAT Parquet"
          echo "Query is: $query"
          filename={{SerialNumber}}_test_ext_storage_$(date +'%Y_%m_%d_%H_%M').parquet
          echo "Filename is: $filename"
          dest="aws s3 cp - s3://{{ExternalStorage}}/$filename"
          echo "Destination cmd is: $dest"
          echo "clickhouse-client --query "$query" | $dest"
          clickhouse-client --query "$query" | $dest
      CloudWatchOutputConfig :
          CloudWatchLogGroupName: ${ssm_log_group}
          CloudWatchOutputEnabled: true
      Targets:
        - Key: 'tag:Environment'
          Values:
            - '${environment}'
        - Key: 'tag:SerialNumber'
          Values:
            - '{{SerialNumber}}'
        - Key: 'tag:Role'
          Values:
            - 'worker'
        - Key: 'tag:Name'
          Values:
            - '{{SerialNumber}}_worker_0'
  - name: detach_iam_policy_role_ext_storage
    action: 'aws:executeScript'
    onFailure: 'step:delete_iam_policy_ext_storage'
    isCritical: true
    description: Remove iam policy from the worker instance
    inputs:
      Runtime: python3.8
      Handler: detach_iam_policy_to_role_handler
      InputPayload:
        SerialNumber: '{{SerialNumber}}'
      Script: |
        import boto3
        import json

        def detach_iam_policy_to_role_handler(event, context):
            sn = event['SerialNumber']
            resource = boto3.resource('iam')
            role_name = sn + '-fsiem-cloud-${environment}'
            role = resource.Role(role_name)
            policy_to_detach_arn = 'arn:aws:iam::${account_id}:policy/test_ext_storage_policy_ssm_${environment}'
            for policy in role.attached_policies.all():
                print("Got policy {}.".format(policy.arn))


                if policy.arn == policy_to_detach_arn:
                    print("Detaching policy {}.".format(policy.arn))
                    response = role.detach_policy(PolicyArn=policy.arn)
                    print("Detachment response:", response)
                    found_policy = True
                    break  # Detach the matching policy, then break out of the loop

            if not found_policy:
                print("Desired policy {} is not attached to the role.".format(policy_to_detach_arn))
  - name: delete_iam_policy_ext_storage
    action: 'aws:executeScript'
    isCritical: true
    onFailure: Abort
    description: Delete iam policy
    inputs:
      Runtime: python3.8
      Handler: delete_iam_inline_policies_handler
      InputPayload:
        SerialNumber: '{{SerialNumber}}'
      Script: |
        import boto3
        import json

        def delete_iam_inline_policies_handler(event, context):
          sn = event['SerialNumber']
          client = boto3.client('iam')
          role_name = sn + '-fsiem-cloud-${environment}'
          policy_arn = 'arn:aws:iam::${account_id}:policy/test_ext_storage_policy_ssm_${environment}'

          # List policies attached to the role
          response_list_policies = client.list_attached_role_policies(RoleName=role_name)
          attached_policies = [policy['PolicyArn'] for policy in response_list_policies['AttachedPolicies']]

          # Delete the policy only if it's not attached to the role
          if policy_arn not in attached_policies:
              response_delete_policy = client.delete_policy(PolicyArn=policy_arn)
              print("Deletion response:", response_delete_policy)
          else:
              print("Policy {} is attached to the role. Skipping deletion.".format(policy_name))


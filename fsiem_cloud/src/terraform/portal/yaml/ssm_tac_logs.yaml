description: |-
  Retrieve the logs from FortiSIEM instances based on Serial Number
schemaVersion: '0.3'
assumeRole: "${assume_role}"
parameters:
  SerialNumber:
    type: String
    description: SerialNumber or Environment ID
    default: 'FSMCLD<id>'
  DaysOfLogs:
    type: String
    description: No of days of Logs that needs to be collected by TAC
    default: '3'
  DeploymentRegion:
    type: String
    description:  AWS Region where fsiem cloud stack is deployed for example us-east-1
mainSteps:
  - name: check_valid_serialnumber
    action: 'aws:invokeLambdaFunction'
    inputs:
      FunctionName: 'lambda_ssm_source_all_${environment}'
      InputPayload:
        SerialNumber: '{{SerialNumber}}'
        ScriptName: 'check_serial_number'
        EnvId: '${environment}'
        DefaultRegion: '${region}'
      InvocationType: 'RequestResponse'
    outputs:
      - Name: ResParam
        Selector: $.Payload
        Type: StringMap
  - name: tac_upload_logs_super
    description: Upload the tac logs from super to the s3 bucket based on the serial number
    action: 'aws:runCommand'
    inputs:
      DocumentName: AWS-RunShellScript
      Parameters:
        commands: |-
          echo "Upload super tac logs to s3 for the authorized serialnumber"
          echo "Create phziplogs with the required days timeframe and store in /tmp/taclogs for all instances"
          export PATH=`su - admin -c env | grep ^PATH= | cut -d''='' -f2-`
          echo "Update path: $PATH"
          phziplogs /tmp/taclogs '{{DaysOfLogs}}' 
          ec2insid=$(wget -q -O - http://169.254.169.254/latest/meta-data/instance-id)
          aws s3 cp /tmp/taclogs s3://fsiem-terraform-${environment}-taclogs/'{{SerialNumber}}'/Super/Super_$(echo $ec2insid)_$(date +"%F_%T") --recursive --region us-east-1
          echo "Successfully uploaded logs to s3 for '{{SerialNumber}}' "
          rm -r /tmp/taclogs
      CloudWatchOutputConfig :
          CloudWatchLogGroupName: ${ssm_log_group}
          CloudWatchOutputEnabled: true
      Targets:
        - Key: 'tag:Environment'
          Values:
            - '${environment}'
        - Key: 'tag:SerialNumber'
          Values:
            - '{{SerialNumber}}'
        - Key: 'tag:Role'
          Values:
            - 'super'
  - name: tac_upload_logs_worker
    description: Upload the tac logs from worker to the s3 bucket based on the serial number
    action: 'aws:runCommand'
    inputs:
      DocumentName: AWS-RunShellScript
      Parameters:
        commands: |-
          echo "Upload worker logs to s3 for the authorized serialnumber"
          echo "Create phziplogs with the required days timeframe and store in /tmp/taclogs for all instances"
          export PATH=`su - admin -c env | grep ^PATH= | cut -d''='' -f2-`
          echo "Update path: $PATH"
          phziplogs /tmp/taclogs '{{DaysOfLogs}}'
          ec2insid=$(wget -q -O - http://169.254.169.254/latest/meta-data/instance-id)
          aws s3 cp /tmp/taclogs s3://fsiem-terraform-${environment}-taclogs/'{{SerialNumber}}'/Worker/Worker_$(echo $ec2insid)_$(date +"%F_%T") --recursive --region us-east-1
          echo "Successfully uploaded logs to s3 for '{{SerialNumber}}' "
          rm -r /tmp/taclogs
      CloudWatchOutputConfig :
          CloudWatchLogGroupName: "${ssm_log_group}"
          CloudWatchOutputEnabled: true
      Targets:
        - Key: 'tag:Environment'
          Values:
            - '${environment}'
        - Key: 'tag:SerialNumber'
          Values:
            - '{{SerialNumber}}'
        - Key: 'tag:Role'
          Values:
            - 'worker'
      MaxConcurrency: '1'
  - name: tac_upload_logs_keeper
    description: Upload the tac logs from keeper to the s3 bucket based on the serial number
    action: 'aws:runCommand'
    inputs:
      DocumentName: AWS-RunShellScript
      Parameters:
        commands: |-
          echo "Upload keeper logs to s3 for the authorized serialnumber"
          echo "Create phziplogs with the required days timeframe and store in /tmp/taclogs for all instances"
          export PATH=`su - admin -c env | grep ^PATH= | cut -d''='' -f2-`
          echo "Update path: $PATH"
          phziplogs /tmp/taclogs '{{DaysOfLogs}}'
          ec2insid=$(wget -q -O - http://169.254.169.254/latest/meta-data/instance-id)
          aws s3 cp /tmp/taclogs s3://fsiem-terraform-${environment}-taclogs/'{{SerialNumber}}'/Keeper/Keeper_$(echo $ec2insid)_$(date +"%F_%T") --recursive --region us-east-1
          echo "Successfully uploaded logs to s3 for '{{SerialNumber}}' "
          rm -r /tmp/taclogs
      CloudWatchOutputConfig :
          CloudWatchLogGroupName: "${ssm_log_group}"
          CloudWatchOutputEnabled: true
      Targets:
        - Key: 'tag:Environment'
          Values:
            - '${environment}'
        - Key: 'tag:SerialNumber'
          Values:
            - '{{SerialNumber}}'
        - Key: 'tag:Role'
          Values:
            - 'keeper'
  - name: list_taclogs_serialnumber
    description: List the logs based on serial number
    action: 'aws:runCommand'
    inputs:
      DocumentName: AWS-RunShellScript
      Parameters:
        commands: |-
          echo "List all content of the S3 tac logs bucket"
          aws s3 ls s3://fsiem-terraform-${environment}-taclogs/'{{SerialNumber}}' --region us-east-1
      CloudWatchOutputConfig :
          CloudWatchLogGroupName: "${ssm_log_group}"
          CloudWatchOutputEnabled: true
      Targets:
        - Key: 'tag:Environment'
          Values:
            - '${environment}'
        - Key: 'tag:SerialNumber'
          Values:
            - '{{SerialNumber}}'

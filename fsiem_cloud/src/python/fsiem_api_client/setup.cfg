[metadata]
author = Fortinet SaaS Team
author_email = fsmeng@fortinet.com
description = "Python modules for SaaS deployment and maintenance"
name = fsiem_api_client
version = 1.0.1

[options]
packages = find:
install_requires =
  requests
  boto3
  packaging
  smart-open
  tenacity
tests_require =
  moto
  pytest
  freezegun

[options.packages.find]
exclude =
  fsiem_api_client.tests*
  fsiem_api_client.integration_tests*

[coverage:run]
branch = True
include = fsiem_api_client/*
omit =
  tests/*
  integration-tests/*

[coverage:report]
show_missing = True
skip_covered = False
skip_empty = True

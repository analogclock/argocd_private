apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: summer-trip
  name: summer-trip-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summer-trip
  template:
    metadata:
      labels:
        app: summer-trip
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: summer-trip-deployment
        image: gcr.io/spry-utility-373201/summer-trip:v2
        imagePullPolicy: Always
